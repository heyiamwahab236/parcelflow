<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">ParcelFlow AWS deployment architecture</title>
<desc id="desc">HTTPS traffic enters an Application Load Balancer and reaches React and Node.js workloads on private EKS nodes. The API connects to isolated RDS PostgreSQL using TLS and retrieves secrets through Pod Identity. GitHub Actions scans images and a trusted runner deploys immutable ECR digests after database migrations. Terraform manages the infrastructure. This is the target configuration; live AWS verification is pending.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718899" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1110" rx="24" fill="#f5f8fb"/>
<rect width="1600" height="150" rx="24" fill="#142c3e"/><rect y="125" width="1600" height="25" fill="#142c3e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="54" y="48" font-size="13" letter-spacing="3" fill="#87d8c9">PARCELFLOW / PLATFORM ENGINEERING</text>
<text x="54" y="93" font-size="35" font-weight="700" fill="white">AWS deployment architecture</text>
<text x="54" y="125" font-size="16" fill="#bccbd7">Private compute. Isolated data. Identity-based access. Controlled delivery.</text>
<rect x="1215" y="48" width="330" height="44" rx="22" fill="#244356"/><text x="1380" y="76" text-anchor="middle" font-size="14" fill="#d2e5ee">TARGET CONFIGURATION · EKS</text>
<rect x="54" y="182" width="1492" height="605" rx="16" fill="#eef3f7" stroke="#dce5ec"/><text x="76" y="214" font-size="16" fill="#294253" font-weight="700">AWS VPC · two availability zones</text><text x="76" y="239" font-size="13" fill="#657f90" font-weight="400">Public ingress • private worker nodes • isolated database subnets</text><rect x="80" y="268" width="315" height="306" rx="16" fill="#fff" stroke="#dce5ec"/><text x="102" y="300" font-size="16" fill="#294253" font-weight="700">01 / PUBLIC EDGE</text><text x="102" y="325" font-size="13" fill="#657f90" font-weight="400">Application ingress and outbound access</text><rect x="425" y="268" width="640" height="306" rx="16" fill="#f1faf7" stroke="#cfe4da"/><text x="447" y="300" font-size="16" fill="#294253" font-weight="700">02 / PRIVATE COMPUTE</text><text x="447" y="325" font-size="13" fill="#657f90" font-weight="400">Amazon EKS · managed node group</text><rect x="1095" y="268" width="425" height="306" rx="16" fill="#f6f3fb" stroke="#e2d9ee"/><text x="1117" y="300" font-size="16" fill="#294253" font-weight="700">03 / ISOLATED DATA</text><text x="1117" y="325" font-size="13" fill="#657f90" font-weight="400">No default route to the internet</text><rect x="105" y="352" width="265" height="100" rx="12" fill="white" stroke="#d7e2e9"/><rect x="105" y="368" width="4" height="68" rx="2" fill="#e39a35"/><text x="123" y="382" font-size="16" fill="#193b4b" font-weight="700">Application Load Balancer</text><text x="123" y="406" font-size="13" fill="#647d8c" font-weight="400">HTTPS · ACM certificate</text><text x="123" y="428" font-size="13" fill="#647d8c" font-weight="400">/ → web     /api → API</text><rect x="105" y="474" width="265" height="76" rx="12" fill="white" stroke="#d7e2e9"/><rect x="105" y="490" width="4" height="44" rx="2" fill="#e39a35"/><text x="123" y="504" font-size="16" fill="#193b4b" font-weight="700">NAT Gateway</text><text x="123" y="528" font-size="13" fill="#647d8c" font-weight="400">Private-node outbound access</text><rect x="452" y="352" width="272" height="100" rx="12" fill="white" stroke="#d7e2e9"/><rect x="452" y="368" width="4" height="68" rx="2" fill="#168c7c"/><text x="470" y="382" font-size="16" fill="#193b4b" font-weight="700">React + Nginx</text><text x="470" y="406" font-size="13" fill="#647d8c" font-weight="400">Non-root, read-only container</text><text x="470" y="428" font-size="13" fill="#647d8c" font-weight="400">Two replicas · health probes</text><rect x="760" y="352" width="278" height="100" rx="12" fill="white" stroke="#d7e2e9"/><rect x="760" y="368" width="4" height="68" rx="2" fill="#168c7c"/><text x="778" y="382" font-size="16" fill="#193b4b" font-weight="700">Node.js API</text><text x="778" y="406" font-size="13" fill="#647d8c" font-weight="400">Validated requests · version checks</text><text x="778" y="428" font-size="13" fill="#647d8c" font-weight="400">HPA: 2–4 pods · health probes</text><rect x="452" y="474" width="586" height="76" rx="12" fill="white" stroke="#d7e2e9"/><rect x="452" y="490" width="4" height="44" rx="2" fill="#168c7c"/><text x="470" y="504" font-size="16" fill="#193b4b" font-weight="700">Database migration job</text><text x="470" y="528" font-size="13" fill="#647d8c" font-weight="400">Separate service account · schema changes before rollout</text><rect x="1120" y="352" width="375" height="100" rx="12" fill="white" stroke="#d7e2e9"/><rect x="1120" y="368" width="4" height="68" rx="2" fill="#8864ac"/><text x="1138" y="382" font-size="16" fill="#193b4b" font-weight="700">Amazon RDS PostgreSQL</text><text x="1138" y="406" font-size="13" fill="#647d8c" font-weight="400">Verified TLS · restricted application role</text><text x="1138" y="428" font-size="13" fill="#647d8c" font-weight="400">Encrypted storage · seven-day backups</text><rect x="1120" y="474" width="375" height="76" rx="12" fill="white" stroke="#d7e2e9"/><rect x="1120" y="490" width="4" height="44" rx="2" fill="#8864ac"/><text x="1138" y="504" font-size="16" fill="#193b4b" font-weight="700">Development availability</text><text x="1138" y="528" font-size="13" fill="#647d8c" font-weight="400">Single-AZ DB · Multi-AZ configurable</text><polyline points="370,380 410,380 410,380 452,380" fill="none" stroke="#718899" stroke-width="2" marker-end="url(#arrow)"/><polyline points="370,425 410,425 410,335 750,335 750,380 760,380" fill="none" stroke="#718899" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1038,396 1120,396" fill="none" stroke="#718899" stroke-width="2" marker-end="url(#arrow)"/><text x="1061" y="382" font-size="12" fill="#5e7889" font-weight="400">TLS</text><polyline points="1038,510 1080,510 1080,432 1120,432" fill="none" stroke="#718899" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="80" y="610" width="455" height="135" rx="12" fill="white" stroke="#d7e2e9"/><rect x="80" y="626" width="4" height="103" rx="2" fill="#8864ac"/><text x="98" y="640" font-size="16" fill="#193b4b" font-weight="700">Secrets Manager + KMS</text><text x="98" y="664" font-size="13" fill="#647d8c" font-weight="400">API reads application secrets only</text><text x="98" y="686" font-size="13" fill="#647d8c" font-weight="400">Migration identity can initialize secrets</text><text x="98" y="708" font-size="13" fill="#647d8c" font-weight="400">No secret values in source or Terraform state</text><rect x="560" y="610" width="465" height="135" rx="12" fill="white" stroke="#d7e2e9"/><rect x="560" y="626" width="4" height="103" rx="2" fill="#4085ae"/><text x="578" y="640" font-size="16" fill="#193b4b" font-weight="700">CloudWatch observability</text><text x="578" y="664" font-size="13" fill="#647d8c" font-weight="400">Application and control-plane logs</text><text x="578" y="686" font-size="13" fill="#647d8c" font-weight="400">KMS encryption · retention policies</text><text x="578" y="708" font-size="13" fill="#647d8c" font-weight="400">Dashboard and alarm definitions</text><rect x="1050" y="610" width="470" height="135" rx="12" fill="white" stroke="#d7e2e9"/><rect x="1050" y="626" width="4" height="103" rx="2" fill="#168c7c"/><text x="1068" y="640" font-size="16" fill="#193b4b" font-weight="700">Workload and API access</text><text x="1068" y="664" font-size="13" fill="#647d8c" font-weight="400">EKS Pod Identity per workload</text><text x="1068" y="686" font-size="13" fill="#647d8c" font-weight="400">Private EKS API by default</text><text x="1068" y="708" font-size="13" fill="#647d8c" font-weight="400">Optional fixed operator /32 addresses</text><text x="80" y="259" font-size="14" fill="#587385" font-weight="400">Customer / operator → DNS hostname → HTTPS listener</text><rect x="54" y="814" width="1492" height="185" rx="16" fill="#fff" stroke="#dce5ec"/><text x="76" y="846" font-size="16" fill="#294253" font-weight="700">SOFTWARE DELIVERY</text><text x="76" y="871" font-size="13" fill="#657f90" font-weight="400">GitHub OIDC • scoped permissions • manual release trigger</text><rect x="80" y="891" width="325" height="82" rx="12" fill="white" stroke="#d7e2e9"/><rect x="80" y="907" width="4" height="50" rx="2" fill="#4085ae"/><text x="98" y="921" font-size="16" fill="#193b4b" font-weight="700">GitHub Actions</text><text x="98" y="945" font-size="13" fill="#647d8c" font-weight="400">Tests · Checkov · Trivy scans</text><rect x="450" y="891" width="310" height="82" rx="12" fill="white" stroke="#d7e2e9"/><rect x="450" y="907" width="4" height="50" rx="2" fill="#4085ae"/><text x="468" y="921" font-size="16" fill="#193b4b" font-weight="700">Amazon ECR</text><text x="468" y="945" font-size="13" fill="#647d8c" font-weight="400">KMS encryption · immutable images</text><rect x="805" y="891" width="390" height="82" rx="12" fill="white" stroke="#d7e2e9"/><rect x="805" y="907" width="4" height="50" rx="2" fill="#4085ae"/><text x="823" y="921" font-size="16" fill="#193b4b" font-weight="700">Trusted deployment runner</text><text x="823" y="945" font-size="13" fill="#647d8c" font-weight="400">Migrate → deploy digest → verify rollout</text><rect x="1240" y="891" width="280" height="82" rx="12" fill="white" stroke="#d7e2e9"/><rect x="1240" y="907" width="4" height="50" rx="2" fill="#8864ac"/><text x="1258" y="921" font-size="16" fill="#193b4b" font-weight="700">Terraform + S3 state</text><text x="1258" y="945" font-size="13" fill="#647d8c" font-weight="400">Encrypted, versioned, locked</text><polyline points="405,933 450,933" fill="none" stroke="#718899" stroke-width="2" marker-end="url(#arrow)"/><polyline points="760,933 805,933" fill="none" stroke="#718899" stroke-width="2" marker-end="url(#arrow)"/><text x="54" y="1039" font-size="12" fill="#657f90" font-weight="700">IMPLEMENTATION NOTES</text><text x="54" y="1067" font-size="15" fill="#294253" font-weight="400">Application and local checks verified. AWS configuration validated with mock plans; live AWS verification pending.</text><text x="54" y="1091" font-size="13" fill="#657f90" font-weight="400">HPA scales pods only. One NAT Gateway and Single-AZ RDS are development trade-offs. DNS and ACM are deployment prerequisites.</text></g></svg>