name: parcelflow
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: parcelflow
      POSTGRES_USER: parcelflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password}
    ports: ['127.0.0.1:54329:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parcelflow -d parcelflow']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      DATABASE_URL: postgresql://parcelflow:${POSTGRES_PASSWORD:-local_demo_password}@db:5432/parcelflow
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-operator-token-change-before-use}
      ALLOW_LOCAL_DB: 'true'
      ALLOW_DEMO_SEED: 'true'
      TRUST_PROXY: 'true'
    command: ['sh', '-c', 'node src/migrate.js && node src/seed.js']
    depends_on:
      db: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    ports: ['127.0.0.1:3000:3000']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres-data:
