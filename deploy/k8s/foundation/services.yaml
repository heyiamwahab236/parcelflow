apiVersion: v1
kind: Service
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
spec:
  selector: { app: api }
  ports: [{ port: 3000, targetPort: http, name: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  selector: { app: web }
  ports: [{ port: 8080, targetPort: http, name: http }]
