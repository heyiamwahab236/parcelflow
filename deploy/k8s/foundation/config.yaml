apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  NODE_ENV: production
  AWS_REGION: REGION_PLACEHOLDER
  DB_HOST: DATABASE_HOST_PLACEHOLDER
  DB_NAME: parcelflow
  DB_SECRET_ARN: DATABASE_SECRET_PLACEHOLDER
  ADMIN_SECRET_ARN: OPERATOR_SECRET_PLACEHOLDER
  MASTER_SECRET_ARN: MASTER_SECRET_PLACEHOLDER
  TRUST_PROXY: 'true'
  PORT: '3000'
