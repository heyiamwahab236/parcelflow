apiVersion: batch/v1
kind: Job
metadata:
  name: parcelflow-migrate
  namespace: parcelflow
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: migration }
    spec:
      restartPolicy: Never
      serviceAccountName: migration
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: API_IMAGE_PLACEHOLDER
          command: [node, src/bootstrap-aws.js]
          envFrom: [{ configMapRef: { name: api-config } }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
