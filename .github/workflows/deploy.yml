name: Deploy to AWS EKS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parcelflow-aws-demo
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    outputs:
      api: ${{ steps.publish.outputs.api }}
      web: ${{ steps.publish.outputs.web }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_API_URL: ${{ vars.ECR_API_URL }}
      ECR_WEB_URL: ${{ vars.ECR_WEB_URL }}
      RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DELIVERY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build release images
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_API_URL:$RELEASE" .
          docker build -f apps/web/Dockerfile -t "$ECR_WEB_URL:$RELEASE" .
      - name: Scan exact API release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: ${{ vars.ECR_API_URL }}:${{ env.RELEASE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan exact web release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: ${{ vars.ECR_WEB_URL }}:${{ env.RELEASE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish immutable images
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_API_URL%%/*}"
          for service in api web; do
            if [ "$service" = api ]; then url="$ECR_API_URL"; else url="$ECR_WEB_URL"; fi
            docker push "$url:$RELEASE"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$url:$RELEASE")
            echo "$service=$digest" >> "$GITHUB_OUTPUT"
          done
  deploy:
    needs: build
    # Dedicated, trusted runner with kubectl, AWS CLI, Python 3 and EKS API connectivity.
    # Never use this runner for pull_request jobs in this public repository.
    runs-on: [self-hosted, linux, parcelflow]
    timeout-minutes: 15
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      API_IMAGE: ${{ needs.build.outputs.api }}
      WEB_IMAGE: ${{ needs.build.outputs.web }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_OUTPUTS_JSON: ${{ vars.TF_OUTPUTS_JSON }}
      TF_OUTPUTS_FILE: work/aws-outputs.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DELIVERY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write non-secret deployment configuration
        run: |
          mkdir -p work
          printf '%s' "$TF_OUTPUTS_JSON" > "$TF_OUTPUTS_FILE"
      - name: Migrate, deploy and verify rollout
        run: bash scripts/deploy.sh
      - name: Check public endpoint after DNS is configured
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 "https://$APP_HOSTNAME/healthz"
